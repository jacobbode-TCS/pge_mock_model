<!doctype html>
<html lang="en">

<head>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
    <meta charset=" utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Multi-Agent Workflow</title>
</head>

<body>
    <h1>Multi-Agent Workflow</h1>
    <p>Submit a request to run the multi-agent workflow through the Flask app.</p>

    <form id="workflow-form">
        <label for="request">Request</label>
        <textarea id="request" name="request" rows="4" placeholder="Describe the task you want help with"></textarea>

        <label>Image (optional)</label>

        <div id="drop-zone" class="drop-zone">
            <p>📁 Drag & Drop an image here</p>
            <p>or click to browse</p>
            <input type="file" id="image-file" accept="image/*" hidden>
        </div>

        <div id="preview-container" style="display:none;">
            <img id="image-preview" class="image-preview">
            <div class="preview-actions">
                <span id="file-name"></span>
                <button type="button" id="clear-image">
                    Remove Image
                </button>
            </div>
        </div>

        <button type="submit">Run workflow</button>
    </form>

    <h2>Workflow Results</h2>

    <div class="results-grid">
        <div class="result-section">
            <h3>Request</h3>
            <pre id="request-result"></pre>
        </div>


        <div class="result-section">
            <h3>Agent</h3>
            <pre id="chosen-agent"></pre>
        </div>
    </div>
    <div class="results-grid">
        <div class="result-section">
            <h3 id="output-heading">Output</h3>
            <div id="output" class="markdown-output"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>


    <script>
        const preview = document.getElementById('image-preview');
        const fileInput = document.getElementById('image-file');
        const dropZone = document.getElementById('drop-zone');
        const fileName = document.getElementById('file-name');
        const previewContainer = document.getElementById('preview-container');
        const clearButton = document.getElementById('clear-image');
        let selectedFile = null;
        const form = document.getElementById('workflow-form');
        const requestResult = document.getElementById('request-result');
        const chosenAgent = document.getElementById('chosen-agent');
        const outputHeading = document.getElementById('output-heading');
        const output = document.getElementById('output');

        function formatOutputValue(value) {
            if (typeof value === 'object' && value !== null) {
                return JSON.stringify(value, null, 2);
            }
            return value || '';
        }

        function updateOutputSection(data) {
            const response = data.response;
            output.innerHTML = marked.parse(formatOutputValue(response));
        }


        function showPreview(file) {

            const reader = new FileReader();

            reader.onload = function (e) {

                preview.src = e.target.result;

                dropZone.style.display = 'none';
                previewContainer.style.display = 'block';

                fileName.textContent = file.name;
            };

            reader.readAsDataURL(file);
        }
        function clearImage() {

            selectedFile = null;

            fileInput.value = '';

            preview.src = '';

            previewContainer.style.display = 'none';
            dropZone.style.display = 'block';

            fileName.textContent = '';
        }
        clearButton.addEventListener('click', clearImage);
        dropZone.addEventListener('click', () => {

            if (selectedFile) {
                return;
            }

            fileInput.click();
        });

        fileInput.addEventListener('change', (event) => {
            selectedFile = event.target.files[0];

            if (selectedFile) {
                fileName.textContent = selectedFile.name;
                showPreview(selectedFile);
            }
        });

        dropZone.addEventListener('dragover', (event) => {

            if (selectedFile) {
                return;
            }

            event.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (event) => {

            if (selectedFile) {
                return;
            }

            event.preventDefault();

            dropZone.classList.remove('dragover');

            selectedFile = event.dataTransfer.files[0];

            if (selectedFile) {
                showPreview(selectedFile);
            }
        });
        preview.addEventListener('click', () => {
            fileInput.click();
        });

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const formData = new FormData();

            formData.append(
                'request',
                document.getElementById('request').value
            );

            if (selectedFile) {
                formData.append('image', selectedFile);
            }

            requestResult.textContent = 'Running...';
            outputHeading.textContent = 'Output';
            output.textContent = 'Running...';
            const res = await fetch('/workflow', {
                method: 'POST',
                body: formData
            });

            const data = await res.json();
            requestResult.textContent = data.request || '';
            chosenAgent.textContent = data.chosen_agent || '';
            updateOutputSection(data);
        });
    </script>
</body>

</html>
